[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/app", "crates/lua"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
ropey = "1"
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
bitflags = "2"

[profile.release]
lto = "thin"
codegen-units = 1
